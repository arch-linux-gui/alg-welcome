name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_release.outputs.should_release }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git cmake qt6-base

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Extract version from CMakeLists.txt
        id: get_version
        run: |
          VERSION=$(grep -oP 'project\(alg-welcome VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if this should trigger a release
        id: check_release
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if git diff --name-only HEAD~1 HEAD | grep -q "CMakeLists.txt"; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "Release triggered: CMakeLists.txt changed on main branch"
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "No release: CMakeLists.txt not changed"
            fi
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No release: not a push event"
          fi

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Strip binary
        run: strip build/alg-welcome

      - name: Package artifacts
        run: |
          mkdir -p release
          cp build/alg-welcome release/
          cp styles.qss release/
          cp -r assets release/
          cd release
          tar -czf alg-welcome-linux-x86_64.tar.gz alg-welcome styles.qss assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alg-welcome-binary
          path: release/alg-welcome-linux-x86_64.tar.gz
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: alg-welcome-binary

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "ALG Welcome v${{ needs.build.outputs.version }}"
          files: alg-welcome-linux-x86_64.tar.gz
          body: |
            ## ALG Welcome v${{ needs.build.outputs.version }}

            ### Installation
            ```bash
            tar -xzf alg-welcome-linux-x86_64.tar.gz
            sudo install -Dm755 alg-welcome /usr/local/bin/alg-welcome
            sudo install -Dm644 styles.qss /usr/local/share/alg-welcome/styles.qss
            sudo install -Dm644 assets/welcome.png /usr/local/share/pixmaps/welcome.png
            ```

            ### Requirements
            - Qt6 Base (qt6-base on Arch Linux)
            - Arch-based distribution
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
