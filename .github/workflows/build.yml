name: Build Archer - Test Build

on:
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm clang git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: find src tests -regex '.*\.\(cpp\|h\)$' -print0 | xargs -0 clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel cmake qt6-base spdlog fmt catch2 git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
